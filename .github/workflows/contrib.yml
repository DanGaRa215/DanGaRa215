# 緑のコントリビューションカレンダーをピンク枠に収めた assets/contrib.svg を日次で更新する。
# 生成物は外部参照を持たない自己完結SVGなので、ghchart 側が落ちても
# README は最後に成功した図を表示し続ける。
name: Build Contribution Graph

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-contrib-svg
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build assets/contrib.svg
        run: python3 scripts/build-contrib.py "${{ github.repository_owner }}" assets/contrib.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib.svg
          if git commit -m "Update contribution graph"; then
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 78" width="460" height="78" role="img" aria-label="Portfolio: dangara215-portfolio.vercel.app">
  <title>Portfolio - dangara215-portfolio.vercel.app</title>

  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF5FB5"/>
      <stop offset="55%"  stop-color="#D6117E"/>
      <stop offset="100%" stop-color="#B8005E"/>
    </linearGradient>
  </defs>

  <!-- 他のバッジやカードが「ピンクの枠 + 透明」なのに対し、ここだけベタ塗りにして
       ポートフォリオへの導線だと一目で分かるようにしている -->
  <rect x="2" y="2" width="456" height="74" rx="18" fill="url(#btn)"/>
  <rect x="6.5" y="6.5" width="447" height="65" rx="14"
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.42"/>

  <!-- ブラウザウィンドウのアイコン -->
  <g transform="translate(26, 23)">
    <rect x="0" y="0" width="32" height="26" rx="4.5"
          fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <path d="M0 8 L32 8" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle cx="5.5" cy="4.2" r="1.35" fill="#FFFFFF"/>
    <circle cx="10.5" cy="4.2" r="1.35" fill="#FFFFFF"/>
    <circle cx="15.5" cy="4.2" r="1.35" fill="#FFFFFF"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="76" y="34" font-size="11" font-weight="700" letter-spacing="3.4"
          fill-opacity="0.88">PORTFOLIO</text>
    <text x="76" y="56" font-size="15.5" font-weight="700" letter-spacing="0.2">dangara215-portfolio.vercel.app</text>
  </g>

  <!-- 右端の矢印。クリックできることを示す -->
  <g transform="translate(408, 39)" stroke="#FFFFFF" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-9 0 L9 0"/>
    <path d="M2.5 -7 L9 0 L2.5 7"/>
  </g>
</svg>

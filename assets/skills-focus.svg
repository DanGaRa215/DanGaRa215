<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 38" width="792" height="38" role="img" aria-label="Machine Learning, Natural Language Processing, Data Visualization, Recommender Systems">
  <title>Machine Learning, Natural Language Processing, Data Visualization, Recommender Systems</title>
  <style>
    /* ロゴだけを色で見せ、ラベルは無彩色に寄せてコントラストを付ける。
       チップは塗りなしなので、ライト時にラベルを白にすると背景の白に溶けて
       読めなくなる。ライトはパレット中で最も濃い #B8005E を当てる。 */
    svg {
      --ink: #D6117E;      /* ロゴ */
      --label: #B8005E;    /* ラベル */
      --edge: #FF9FD3;     /* チップの枠 */
    }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #FF6EC7; --label: #FFFFFF; --edge: #FF5FB5; }
    }
  </style>

  <g transform="translate(0.0, 0)">
    <rect x="0.75" y="0.75" width="156.1" height="36.5" rx="18.2" fill="none" stroke="var(--edge)" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--label)">Machine Learning</text>
  </g>
  <g transform="translate(167.6, 0)">
    <rect x="0.75" y="0.75" width="239.4" height="36.5" rx="18.2" fill="none" stroke="var(--edge)" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--label)">Natural Language Processing</text>
  </g>
  <g transform="translate(418.5, 0)">
    <rect x="0.75" y="0.75" width="163.1" height="36.5" rx="18.2" fill="none" stroke="var(--edge)" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--label)">Data Visualization</text>
  </g>
  <g transform="translate(593.2, 0)">
    <rect x="0.75" y="0.75" width="197.0" height="36.5" rx="18.2" fill="none" stroke="var(--edge)" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="var(--label)">Recommender Systems</text>
  </g>
</svg>

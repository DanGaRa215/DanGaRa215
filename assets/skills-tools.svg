  <style>
    /* ロゴだけを色で見せ、ラベルは無彩色に寄せてコントラストを付ける。
       チップは塗りなしなので、ライト時にラベルを白にすると背景の白に溶けて
       読めなくなる。ライトはパレット中で最も濃い #B8005E を当てる。 */
    svg {
      --ink: #D6117E;      /* ロゴ */
      --label: #B8005E;    /* ラベル */
      --edge: #FF9FD3;     /* チップの枠 */
    }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #FF6EC7; --label: #FFFFFF; --edge: #FF5FB5; }
    }
  </style>

